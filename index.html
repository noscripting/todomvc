			><button type="button" class="tog" id="g12" commandfor="tc12" command="toggle-popover" aria-labelledby="g12 t12"

			><label for="t12" class="under"

			><span class="tn">Todo</span
			><span class="tnn">New todo</span></span></label
			><span popover class="pop" id="p12"
			><input class="sink" required maxlength="0" tabindex="-1" aria-hidden="true"

			><button type="button" class="open" popovertarget="p12" popovertargetaction="show" tabindex="-1" aria-labelledby="edit t12"></button

			><i class="cf"
			><iframe class="copy" name="s12" sandbox tabindex="-1" aria-hidden="true"></iframe></i
			><span class="destroy"
			><span class="dq"
			><button type="button" class="gone" commandfor="gx12" command="toggle-popover" aria-labelledby="del t12"></button
			><i class="cmd gxc" id="gx12" popover="manual"></i
			><button type="reset" class="wipe" aria-labelledby="del t12"></button></span></span></div>
<i class="wt w0"></i

</div></li>

			><i class="ws w2"></i></div>

			><i class="q0"
